# Pre-approve build scripts for the packages C3 itself installs that need
# them: `workerd` downloads the platform binary, `esbuild` and `sharp`
# (via miniflare) download/build native bindings. Without these, pnpm 11+
# aborts the install with ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  esbuild: true
  workerd: true
  sharp: true
minimumReleaseAgeExclude:
  - '@cloudflare/vite-plugin@1.45.1'
  - '@cloudflare/vitest-pool-workers@0.18.6'
  - miniflare@4.20260714.0
  - wrangler@4.112.0

# Force patched versions of vulnerable transitive dev-tool dependencies
# (audit gate: pnpm audit --audit-level high). Reviewed 2026-09-20.
overrides:
  brace-expansion@<1.1.18: 1.1.18
  brace-expansion@>=2.0.0 <2.1.4: 2.1.4
  brace-expansion@>=5.0.0 <5.0.9: 5.0.9
  browserslist@<4.28.7: ^4.28.7
  fast-uri: ^3.1.6
  ip-address@<10.3.1: ^10.3.1
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  nanoid@<3.3.18: ^3.3.18
  sharp@<0.35.4: ^0.35.4
  undici@>=7.0.0 <7.29.0: ^7.29.0
